# Blueprint de Render: API Express + MongoDB Atlas.
# Los secretos (sync: false) se capturan en el panel de Render, nunca en el repo.
services:
  - type: web
    name: til-backend
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DB_TARGET
        value: atlas
      - key: DB_NAME
        value: til_platform
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: JWT_CLIENT_TTL
        value: 1h
      # URI de MongoDB Atlas (mongodb+srv://...)
      - key: MONGO_URI_ATLAS
        sync: false
      # Orígenes de los 4 frontends separados por coma, sin "/" final ni "*"
      # Ej: https://til-superadmin.onrender.com,https://til-forwarder.onrender.com,https://til-operator.onrender.com,https://til-tracker.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # >= 32 caracteres y distintos entre sí
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_CLIENT_SECRET
        generateValue: true
